# Influx v0.7 Example Configuration
# Copy to influx.toml (cwd), ~/.influx/influx.toml, or /etc/influx/influx.toml
# and adjust to taste.  Alternatively set INFLUX_CONFIG to point here.

# ---------------------------------------------------------------------------
# Core settings
# ---------------------------------------------------------------------------

[influx]
note_schema_version = 1         # stamped on every Influx-authored note

[schedule]
cron = "0 6 * * *"              # daily at 06:00
timezone = "UTC"
misfire_grace_seconds = 3600    # tolerate missed fires within an hour
# Stagger the per-tick request pattern away from exact hour boundaries
# (issue #87) so we don't cluster with every other arXiv consumer at
# `:00:NN`.  ``initial_jitter_seconds`` adds a uniform random delay in
# ``[0, N]`` before fan-out begins; ``inter_profile_gap_seconds``
# serialises profiles within one tick with the configured gap between
# them.  Both default to 0 (legacy parallel fan-out).
# initial_jitter_seconds = 30
# inter_profile_gap_seconds = 1800   # 30 minutes between profiles

[storage]
archive_dir = "/archive"
state_dir = "/state"
retain_days = 3650              # ~10 years
max_download_bytes = 52_428_800 # 50 MB per file
download_timeout_seconds = 30

# Issue #149: domain-aware archive acquisition policy.  Maps a host
# suffix to one of three modes:
#   blocked       — try the download but expect HTTP 403 / WAF; the
#                    note is tagged ``influx:archive-blocked`` and
#                    ``influx:archive-terminal`` so the repair sweep
#                    stops re-attempting the doomed path.
#   rate_limited  — try the download but expect HTTP 429; the note is
#                    tagged ``influx:archive-rate-limited`` and stays
#                    in the normal repair-needed loop.
#   skip          — do not attempt the download at all; the note is
#                    tagged ``influx:archive-skipped-by-policy``.
# A built-in defaults set already covers the staging hot offenders
# (``science.org``, ``alignmentforum.org``, ``therobotreport.com``,
# ``tnmoc.org``, ``lesswrong.com``); set ``include_defaults = false``
# to opt out, or override per-domain in the maps below.
#
# [storage.archive_policy]
# include_defaults = true
#
# [storage.archive_policy.blocked]
# "example.com" = "WAF challenge observed 2026-04-15 onward"
#
# [storage.archive_policy.rate_limited]
# "slow.example" = "429 under 1-min cadence; cool-down before retry"
#
# [storage.archive_policy.skip]
# "never.example" = "auth-walled; archive disabled permanently"

[notifications]
timeout_seconds = 5

# Legacy fallback: when set, Influx emits a single generic run digest.
# Prefer [[notifications.webhooks]] for new deployments.
webhook_url = ""

# Example typed sinks:
#
# [[notifications.webhooks]]
# name = "generic-digest"
# type = "generic_digest"
# url = "http://webhook-receiver.local/influx"
# enabled = true
# notify_on = ["manual", "scheduled"]
# event_mode = "digest"
#
# [[notifications.webhooks]]
# name = "agent-zero-inbox-rfc"
# type = "agent_zero_rfc_message"
# url = "http://agent-zero:50001/api/rfc"
# enabled = true
# notify_on = ["manual", "scheduled"]
# event_mode = "article"
# min_score = 8
# context = "InfluxIn"
# rfc_module = "usr.influx_rfc"
# rfc_function = "enqueue_message"
# rfc_password_env = "AGENT_ZERO_RFC_PASSWORD"
#
# [[notifications.webhooks]]
# name = "agent-zero-toast"
# type = "agent_zero_notification_create"
# url = "http://agent-zero:50001/api/notification_create"
# enabled = true
# notify_on = ["manual", "scheduled"]
# event_mode = "article"
# min_score = 8
# auth_token_env = "INFLUX_AGENT_ZERO_TOKEN"
#
# The direct Agent Zero HTTP endpoints above sit behind session auth when Agent
# Zero login is enabled. Prefer the RFC sink for service-to-service delivery.
# The toast adapter is mainly useful in deployments without Agent Zero UI auth,
# or after adding a separate RFC helper for notifications.
#
# [[notifications.webhooks]]
# name = "openclaw-whatsapp"
# type = "openclaw_agent"
# url = "http://127.0.0.1:18789/hooks/agent"
# enabled = true
# notify_on = ["manual", "scheduled"]
# event_mode = "digest"
# min_score = 8
# deliver = true
# wake_mode = "now"
# channel = "whatsapp"
# sender_name = "Influx"
# auth_token_env = "INFLUX_OPENCLAW_TOKEN"

[security]
allow_private_ips = false

# ---------------------------------------------------------------------------
# Interest Profiles
# Profile names MUST match: ^[a-z][a-z0-9-]{0,31}$
# ---------------------------------------------------------------------------

[[profiles]]
name = "ai-robotics"
description = """
  HIGH INTEREST: Multi-agent systems, agent memory and knowledge graphs,
  humanoid and social robotics, LLM reasoning and planning, emotional models
  for robots, intelligent AI companions, neurosymbolic reasoning.

  MEDIUM INTEREST: LLM agents with tool use or memory, reinforcement learning
  for robotics, vision-language-action models, cognitive architectures.

  LOW INTEREST / EXCLUDE: General ML without agent/robot angle, CV without
  robotics context, federated learning, model compression, medical imaging,
  benchmarks-only papers.
  """

[profiles.thresholds]
relevance = 7
full_text = 8
deep_extract = 9
notify_immediate = 8
lcma_edge_score = 0.75

[profiles.sources.arxiv]
enabled = true
categories = ["cs.AI", "cs.RO", "cs.MA", "cs.NE", "cs.CL", "cs.LO"]
max_results_per_category = 200
# 3 days tolerates arxiv's natural release gaps (weekends, holidays).
# Set narrower (e.g. 1) only when the cron interval is short enough
# that you don't need same-paper overlap across sweeps.
lookback_days = 3

[[profiles.sources.rss]]
name = "Andrej Karpathy"
url = "https://karpathy.github.io/feed.xml"
source_tag = "blog"

[[profiles.sources.rss]]
name = "Lilian Weng"
url = "https://lilianweng.github.io/index.xml"
source_tag = "blog"

# Second profile — RSS-only example
[[profiles]]
name = "web-tech"
description = """
  Web platform standards, browser internals, JavaScript engines, WASM,
  CSS Houdini, and novel front-end architectures.
  """

[profiles.thresholds]
relevance = 6
full_text = 7
deep_extract = 9
notify_immediate = 7
lcma_edge_score = 0.80

[profiles.sources.arxiv]
enabled = false

[[profiles.sources.rss]]
name = "Mozilla Hacks"
url = "https://hacks.mozilla.org/feed/"
source_tag = "rss"

# ---------------------------------------------------------------------------
# Providers
# ---------------------------------------------------------------------------

# NOTE: the shipped JSON-mode caller (src/influx/enrich.py) speaks
# OpenAI-compatible /chat/completions only. Provider entries below
# must expose an OpenAI-compatible API surface (OpenAI itself,
# OpenRouter, etc.). Anthropic's native API is NOT compatible —
# route Claude through OpenRouter or OpenAI-compatible gateway
# instead of binding [models.*].provider to Anthropic directly.

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
extra_headers = { "HTTP-Referer" = "https://example.invalid/influx", "X-Title" = "Influx" }

# ---------------------------------------------------------------------------
# Models (filter / enrich / extract)
# ---------------------------------------------------------------------------

[models.filter]
provider = "openai"
model = "openai/gpt-4.1-mini"
temperature = 0.0
max_tokens = 2048
request_timeout = 30
max_retries = 2
json_mode = true

[models.enrich]
provider = "openai"
model = "openai/gpt-4.1-mini"
temperature = 0.2
request_timeout = 30
max_retries = 2
json_mode = true
# OpenAI's structured-outputs mode pins the response shape to the
# `Tier1Enrichment` Pydantic schema, so the model can't return
# unexpected element types (e.g. dicts in `contributions`).  Only set
# this `true` for OpenAI models that explicitly support structured
# outputs; OpenRouter routes to non-OpenAI backends may reject it.
json_schema_strict = true

[models.extract]
provider = "openrouter"
model = "anthropic/claude-sonnet-4.6"
temperature = 0.2
request_timeout = 60
max_retries = 2
json_mode = true
# Leave `json_schema_strict` off when routing through OpenRouter to
# non-OpenAI models — Claude via OpenRouter doesn't accept the strict
# `json_schema` response_format.  Switch to true if you point this slot
# at a native OpenAI model that supports structured outputs (e.g.
# `provider = "openai"`, `model = "gpt-4.1"`).

# ---------------------------------------------------------------------------
# Prompts (filter / tier1_enrich / tier3_extract)
# Each entry requires exactly one of `text` or `path`.
# ---------------------------------------------------------------------------

[prompts.filter]
text = """
You are a research paper relevance filter.  Score each paper for relevance
to the following interest profile.

## INTEREST PROFILE
{profile_description}

## NEGATIVE EXAMPLES
{negative_examples}

## OUTPUT FORMAT
Return JSON with "results" array.  For each paper with score >= {min_score_in_results}:
  "id", "score" (1-10), "tags" (2-5 keywords), "reason" (one sentence).
"""

[prompts.tier1_enrich]
text = """
Given the paper title and abstract, extract:
1. Key contributions (3-5 bullet points)
2. Primary method (1-2 sentences)
3. Main result (1-2 sentences)
4. Relevance to: {profile_summary}

Title: {title}
Abstract: {abstract}

Return JSON: {{"contributions": [...], "method": "...", "result": "...", "relevance": "..."}}
"""

[prompts.tier3_extract]
text = """
From the full text of the paper, extract structured information.

Title: {title}
Full text: {full_text}

Return JSON with five keys: claims, datasets, builds_on, open_questions,
potential_connections.  Every value must be a list of plain strings —
do NOT wrap items as objects with sub-fields like {{"claim": "...",
"score": 0.8}}.  Use natural-language sentences as the list elements.
For builds_on, include arXiv references in the form "arXiv:<id>" when
known; for example "Attention is all you need (arXiv:1706.03762)".
"""

# ---------------------------------------------------------------------------
# Filter tuning
# ---------------------------------------------------------------------------

[filter]
batch_size = 25
min_score_in_results = 6
negative_example_max_title_chars = 200

# ---------------------------------------------------------------------------
# Extraction tuning
# ---------------------------------------------------------------------------

[extraction]
min_html_chars = 1000
min_web_chars = 500
strip_tags = ["script", "iframe", "object", "embed"]

# ---------------------------------------------------------------------------
# Resilience
# ---------------------------------------------------------------------------

[resilience]
# Issue #129: defaults are now production-tuned out of the box.
# - max_retries (5) covers transient network / 5xx failures.
# - arxiv_429_backoff_seconds (30) is the *base* delay on HTTP 429;
#   each subsequent 429 in the same fetch doubles the wait
#   (30, 60, 120, ...) up to arxiv_429_backoff_max_seconds.
# - arxiv_429_max_retries (5) is a separate, more generous budget for
#   429 specifically — 429 is a soft rate-limit signal, not a hard
#   network failure, and warrants more patience.
# - arxiv_request_min_interval_seconds (3) is enforced *per process*
#   across all arXiv fetches (scheduled and backfill), so two profiles
#   in the same tick cannot hit arXiv back-to-back.
# Retry-After headers, when present, override the computed 429 backoff
# but are themselves clamped to arxiv_429_backoff_max_seconds.
max_retries = 5
backoff_base_seconds = 1
arxiv_request_min_interval_seconds = 3
arxiv_429_backoff_seconds = 30
arxiv_429_backoff_max_seconds = 120
arxiv_429_max_retries = 5
# Issue #146: adaptive cooldown for repeated arXiv 429 bursts.
# After N (= arxiv_429_cooldown_threshold) consecutive *final* 429
# failures (i.e. the in-fetch retry budget was exhausted), subsequent
# arXiv fetches are skipped quickly for arxiv_429_cooldown_seconds
# instead of replaying the same retry storm.  The first successful
# fetch (or the duration elapsing) clears the cooldown.  Set
# arxiv_429_cooldown_threshold = 0 to disable wholesale.
arxiv_429_cooldown_threshold = 3
arxiv_429_cooldown_seconds = 900
lithos_write_conflict_max_retries = 1

# ---------------------------------------------------------------------------
# Feedback
# ---------------------------------------------------------------------------

[feedback]
negative_examples_per_profile = 20
recalibrate_after_runs = 7

# ---------------------------------------------------------------------------
# Repair
# ---------------------------------------------------------------------------

[repair]
max_items_per_run = 100

# ---------------------------------------------------------------------------
# Telemetry
# ---------------------------------------------------------------------------

[telemetry]
enabled = false
console_fallback = false
service_name = "influx"
# environment = "staging"        # usually supplied by env INFLUX_ENVIRONMENT
export_interval_ms = 30000

# ---------------------------------------------------------------------------
# Inbox (manual submission) — docs/plans/inbox.md
# ---------------------------------------------------------------------------
# Opt-in intake of agent-submitted URLs via Lithos tasks tagged
# "influx:inbox". Default-off: with [inbox] absent or enabled=false no
# inbox-tick job is registered and behaviour is unchanged.

[inbox]
enabled = false                 # opt in to register the influx-inbox-tick job
poll_cron = "*/5 * * * *"       # how often to poll for pending InboxTasks
timezone = "UTC"
max_items_per_tick = 20         # cap on items claimed+processed per tick
agent_id = "influx-inbox"       # agent id used for task claim/update/complete
# task_tag is the fixed protocol constant "influx:inbox" (not tunable)
