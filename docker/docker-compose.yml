# Influx Docker Compose configuration
services:
  influx:
    image: ${INFLUX_IMAGE:-influx:dev}
    pull_policy: never
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ${INFLUX_CONTAINER_NAME:-influx}
    user: "${INFLUX_UID:-1000}:${INFLUX_GID:-1000}"
    restart: unless-stopped
    volumes:
      - ${INFLUX_DATA_PATH:-./data}:/data
      - ${INFLUX_ARCHIVE_PATH:-./archive}:/archive
      - ${INFLUX_STATE_PATH:-./state}:/state
      # Inbox PDF intake (docs/plans/inbox.md §16.3): the host submit script
      # stages PDFs here and sends an absolute local_path that the container
      # opens as-is, so submitter and Influx MUST share this directory at the
      # SAME absolute path. This is an identity mount (host path == container
      # path), not a remap like the volumes above. Override per environment
      # via INFLUX_INBOX_PDF_ROOT; leave [inbox] pdf_root unset to disable
      # local-PDF intake entirely (the mount is then harmless/unused).
      - ${INFLUX_INBOX_PDF_ROOT:-/tmp/staging-pdf-inbox}:${INFLUX_INBOX_PDF_ROOT:-/tmp/staging-pdf-inbox}
    ports:
      - "${INFLUX_ADMIN_HOST_PORT:-8080}:${INFLUX_ADMIN_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - INFLUX_CONFIG=/data/influx.toml
      - INFLUX_DATA_DIR=/data
      - INFLUX_ENVIRONMENT=${INFLUX_ENVIRONMENT:-dev}
      - INFLUX_ADMIN_BIND_HOST=${INFLUX_ADMIN_BIND_HOST:-127.0.0.1}
      - INFLUX_ADMIN_PORT=${INFLUX_ADMIN_PORT:-8080}
      - INFLUX_OTEL_ENABLED=${INFLUX_OTEL_ENABLED:-false}
      - INFLUX_OTEL_CONSOLE_FALLBACK=${INFLUX_OTEL_CONSOLE_FALLBACK:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-influx}
      - OTEL_BSP_SCHEDULE_DELAY=${OTEL_BSP_SCHEDULE_DELAY:-30000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Webhook auth tokens — referenced by influx.toml `auth_token_env` /
      # `rfc_password_env` for the openclaw-agent and agent-zero-inbox-rfc
      # outbound webhooks (FR-NOT-*).
      - OPENCLAW_TOKEN=${OPENCLAW_TOKEN:-}
      - AGENT_ZERO_RFC_PASSWORD=${AGENT_ZERO_RFC_PASSWORD:-}
