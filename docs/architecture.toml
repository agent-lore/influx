# Architecture model for the "diagrams as tests" guardrail.
#
# Single source of truth for:
#   - the generated component diagram + per-component pages
#   - which modules are scanned for the domain class diagram
#   - the architecture metrics snapshot and its hard budgets
#
# The directional layering contract lives in pyproject.toml
# ([tool.importlinter]); the tiers below document that intent (dependencies must
# only point downward, Entrypoints -> Core -> Foundation) and group the diagram.
#
# `component_of()` matches a module to a component by LONGEST module-prefix, so
# "influx.sources" also captures "influx.sources.arxiv" etc.
#
# This project uses the portable guardrail kit (tests/guardrail/ + scripts/) with
# only the core views enabled. The kit's two optional adapters — [tool_catalog]
# (a decorator-registered MCP tool surface) and [containers] (on-disk data
# stores) — are omitted: influx is an MCP client to Lithos (its HTTP surface is
# FastAPI, not an MCP tool surface) and its file-based stores have no central
# store-config class to anchor a container view to.

[project]
root_package = "influx"
src_layout   = "src"

# One-line description per component, shown at the top of its drill-down page
# (docs/generated/components/<Component>.md). test_component_pages requires one
# for every component in [components].
[component_docs]
Entrypoint    = "CLI entry / process bootstrap (`influx …` console script, `python -m influx`)."
HttpApi       = "FastAPI HTTP surface (/runs, /backfills, /ready) and backfill request handling."
Orchestration = "Schedules ticks and drives per-Profile Runs / inbox ticks end-to-end (Run / RunService / InboxTick)."
Sources       = "arXiv / RSS / inbox adapters: fetch candidates, acquire (download/archive), and extract text."
Filter        = "Score-gated entry: scores candidates 1–10 against the Profile and drops sub-threshold items."
Enrich        = "The score-gated tiered enrichment cascade (Tier 1 summary / Tier 2 full text / Tier 3 extraction)."
Repair        = "The per-Run repair sweep, per-tier repair counters, archive policy, and promotion gating."
Storage       = "Filesystem archive of source material and archive-path / download policy."
LithosBridge  = "Renders CanonicalNotes and is the write-mostly MCP/SSE client to Lithos (WriteResult, dedup, LCMA wiring)."
Feedback      = "Negative-example feedback loop, rejection-rate logging, and run-level dedup."
Notifications = "Post-run webhook / digest notification dispatch."
Config        = "Pydantic config schema / loading, health probes, slug generation, and prompt templates."
Observability = "OpenTelemetry tracing, metrics, and structured logging setup."
Schemas       = "The LLM extraction contracts (Pydantic filter / enrichment / extraction models)."
Common        = "Cross-cutting foundation: errors, per-Profile run coordinator, RunLedger, HTTP client, shared enums."

[components]
Entrypoint    = ["influx.main", "influx.__main__"]
HttpApi       = ["influx.http_api", "influx.service", "influx.backfill"]
Orchestration = ["influx.scheduler", "influx.run_service", "influx.run", "influx.inbox", "influx.audit_invalid_source"]
Sources       = ["influx.source", "influx.sources", "influx.extraction"]
Filter        = ["influx.filter"]
Enrich        = ["influx.enrich", "influx.cascade"]
Repair        = ["influx.repair", "influx.repair_hooks", "influx.repair_counters", "influx.archive_policy", "influx.promotion_gate"]
Storage       = ["influx.storage"]
LithosBridge  = ["influx.lithos_client", "influx.lcma", "influx.lcma_wiring", "influx.dedup", "influx.canonical_note", "influx.notes", "influx.renderer", "influx.urls"]
Feedback      = ["influx.feedback", "influx.rejection_rate", "influx.run_dedup"]
Notifications = ["influx.notifications"]
Config        = ["influx.config", "influx.probes", "influx.slugs", "influx.prompts"]
Observability = ["influx.telemetry", "influx.metrics", "influx.logging_config"]
Schemas       = ["influx.schemas"]
Common        = ["influx.errors", "influx.coordinator", "influx.run_ledger", "influx.thin_summary", "influx.http_client", "influx.source_kind"]

[tiers]
Entrypoints = ["Entrypoint", "HttpApi", "Orchestration"]
Core        = ["Sources", "Filter", "Enrich", "Repair", "Storage", "LithosBridge", "Feedback", "Notifications"]
Foundation  = ["Config", "Observability", "Schemas", "Common"]

# Hard architecture budgets, checked by tests/guardrail/test_metrics_budgets.py
# against the metrics snapshot (docs/generated/metrics.md explains each one).
# CI fails if a measured value exceeds its budget. Raising a budget is allowed
# but must be an explicit, reviewed edit to this file; lower a budget after
# improving the code to lock in the gain.
#
# Most budgets below are tight ratchets pinned at today's value (any regression
# fails CI). max_module_lines is the exception: it is a STOP-LOSS ceiling set a
# little above today's largest module so a big module can't quietly balloon — it
# is deliberately NOT pinned to the exact current high-water mark. Ratchet the
# *count* of oversized modules down via modules_over_800_lines instead.
[budgets]
cross_component_edges  = 64   # measured 2026-07; direction: down
component_cycles       = 3    # Common<->Config, a Core SCC, HttpApi<->Orchestration; goal: fewer
module_cycles          = 3    # goal: 0
modules_over_800_lines = 12   # existing god modules; direction: down, no new ones
max_module_lines       = 2000 # stop-loss; largest today is sources.arxiv at 1912

# Domain class diagram: scoped to the LLM extraction contracts (schemas) and the
# run-cycle data types — the same narrow scope as before this kit landed. Every
# other model-bearing module (source candidates, cascade, canonical notes,
# notifications, repair, storage, infra clients, config) is out of the diagram's
# current scope and excluded so the always-on completeness gate
# (test_every_model_is_scanned_or_excluded) passes. Widen include_modules to
# diagram more of the domain.
[domain]
include_modules = ["influx.schemas", "influx.run", "influx.lcma_wiring"]
exclude_modules = [
    "influx.config",
    "influx.errors",
    "influx.archive_policy",
    "influx.audit_invalid_source",
    "influx.canonical_note",
    "influx.cascade",
    "influx.extraction",
    "influx.http_api",
    "influx.http_client",
    "influx.inbox",
    "influx.lithos_client",
    "influx.notes",
    "influx.notifications",
    "influx.probes",
    "influx.promotion_gate",
    "influx.renderer",
    "influx.repair",
    "influx.repair_counters",
    "influx.repair_hooks",
    "influx.run_dedup",
    "influx.run_ledger",
    "influx.run_service",
    "influx.source",
    "influx.sources",
    "influx.storage",
    "influx.urls",
]
