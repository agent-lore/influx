[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "influx"
version = "0.1.0"
description = "Influx"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Dave Snowdon" }]
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.8,<2",
    "python-dotenv>=1.0",
    "pydantic>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "apscheduler>=3.10,<4",
    "trafilatura>=2.0",
    "pypdf>=6.13.3",
    "feedparser>=6.0,<7",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.scripts]
influx = "influx.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/influx"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "pyright>=1.1",
    "respx>=0.22",
    "ruff>=0.4",
    # OTEL extras are pulled into the dev environment so that the
    # FR-OBS-4 enabled-path unit + integration tests exercised by
    # ``make check`` actually run against a real OTEL SDK rather than
    # being skipped when ``opentelemetry`` is not installed.
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "grimp>=3.14",
    "import-linter>=2.12",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.importlinter]
# Directional architecture contract: dependencies must only point downward,
# Entrypoints -> Core -> Foundation. Expressed as `forbidden` contracts (not
# `layers`) because the orchestration entrypoints import each other and some
# core modules legitimately import siblings, which a strict layers contract
# would reject.
root_package = "influx"

[[tool.importlinter.contracts]]
name = "Foundation must not import Core or Entrypoints"
type = "forbidden"
source_modules = [
    "influx.config",
    "influx.probes",
    "influx.slugs",
    "influx.prompts",
    "influx.telemetry",
    "influx.metrics",
    "influx.logging_config",
    "influx.schemas",
    "influx.errors",
    "influx.coordinator",
    "influx.run_ledger",
    "influx.thin_summary",
    "influx.http_client",
    "influx.source_kind",
]
forbidden_modules = [
    "influx.source",
    "influx.sources",
    "influx.extraction",
    "influx.filter",
    "influx.enrich",
    "influx.cascade",
    "influx.repair",
    "influx.repair_hooks",
    "influx.repair_counters",
    "influx.archive_policy",
    "influx.promotion_gate",
    "influx.storage",
    "influx.lithos_client",
    "influx.lcma",
    "influx.lcma_wiring",
    "influx.dedup",
    "influx.canonical_note",
    "influx.notes",
    "influx.renderer",
    "influx.urls",
    "influx.feedback",
    "influx.rejection_rate",
    "influx.run_dedup",
    "influx.notifications",
    "influx.main",
    "influx.__main__",
    "influx.http_api",
    "influx.service",
    "influx.backfill",
    "influx.scheduler",
    "influx.run_service",
    "influx.run",
    "influx.inbox",
    "influx.audit_invalid_source",
]

[[tool.importlinter.contracts]]
name = "Core must not import Entrypoints"
type = "forbidden"
source_modules = [
    "influx.source",
    "influx.sources",
    "influx.extraction",
    "influx.filter",
    "influx.enrich",
    "influx.cascade",
    "influx.repair",
    "influx.repair_hooks",
    "influx.repair_counters",
    "influx.archive_policy",
    "influx.promotion_gate",
    "influx.storage",
    "influx.lithos_client",
    "influx.lcma",
    "influx.lcma_wiring",
    "influx.dedup",
    "influx.canonical_note",
    "influx.notes",
    "influx.renderer",
    "influx.urls",
    "influx.feedback",
    "influx.rejection_rate",
    "influx.run_dedup",
    "influx.notifications",
]
forbidden_modules = [
    "influx.main",
    "influx.__main__",
    "influx.http_api",
    "influx.service",
    "influx.backfill",
    "influx.scheduler",
    "influx.run_service",
    "influx.run",
    "influx.inbox",
    "influx.audit_invalid_source",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Make Influx-owned warnings fail CI.  The unawaited-coroutine pattern
# from issue #3 is emitted from a destructor and pytest wraps it as a
# ``PytestUnraisableExceptionWarning``, so we error on both that and
# plain ``RuntimeWarning``.  Known third-party teardown noise from
# anyio MCP-client streams, file descriptors, and sockets is ignored
# narrowly so the gate doesn't drown in upstream resource leaks.
#
# ``DeprecationWarning`` is dominated by upstream packages
# (``websockets`` via MCP/uvicorn) and left at default verbosity.
#
# Re-tighten as upstream packages are updated.
filterwarnings = [
    # Anyio MCP-client teardown leaks (third-party, not actionable here).
    # pytest filter strings use ``:`` as a separator, so we match against
    # the substrings that follow the ``Exception ignored in:`` prefix.
    "ignore:.*MemoryObjectReceiveStream",
    "ignore:.*<_io\\.FileIO",
    "ignore:.*<_io\\.BufferedReader",
    "ignore:.*<socket\\.socket",
    # Influx-owned regressions.
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
